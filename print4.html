<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>নূরমহল - অ্যাডমিন (তরিকুল)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important} body{font-family:sans-serif;background:#eef2f7;margin:0;padding:12px}
.form{background:#fff;max-width:520px;margin:0 auto 14px;padding:16px;border-radius:16px;box-shadow:0 4px 16px #0001}
.form h2{text-align:center;margin:0 0 4px;color:#0d3a6b;font-size:19px}
.form p{text-align:center;margin:0 0 10px;font-size:13px;color:#555}
label{font-size:13px;font-weight:bold;display:block;margin-top:10px} input,select{width:100%;padding:11px;border:1.5px solid #ddd;border-radius:10px;font-size:15px;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:14px;background:#0d5c3f;color:#fff;border:0;border-radius:12px;font-size:17px;font-weight:bold;margin-top:14px;cursor:pointer}
.btn2{width:100%;padding:12px;background:#0d3a6b;color:#fff;border:0;border-radius:12px;font-size:16px;font-weight:bold;margin-top:8px;cursor:pointer}
.btnDown{width:100%;max-width:520px;margin:0 auto 12px;display:block;padding:14px;background:#0d3a6b;color:#fff;border:0;border-radius:12px;font-size:17px;font-weight:bold;cursor:pointer}
.page{max-width:520px;margin:0 auto}
.ticket{border:2.5px solid #0d3a6b;border-radius:16px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.head{background:linear-gradient(90deg,#0d3a6b,#155e9e)!important;color:#fff;padding:10px 12px;display:flex;gap:10px;align-items:center}
.head .bus{font-size:30px;background:#fff;border-radius:10px;padding:4px 7px;flex-shrink:0;line-height:1}
.head h3{margin:0;font-size:19px;line-height:1.2;white-space:nowrap}
.head p{margin:3px 0 0;font-size:11.5px;color:#ffe58a;white-space:nowrap}
.gold{height:6px;background:linear-gradient(90deg,#e8a91c,#ffcf3f)!important}
.body{padding:12px 14px 9px;flex:1;display:flex;flex-direction:column}
.trow{display:flex;justify-content:space-between;align-items:center;font-weight:bold;font-size:14px;color:#0d3a6b}
.gariRow{background:#fff2a8!important;border:1.5px solid #e8a91c;border-radius:9px;text-align:center;font-weight:900;font-size:16px;color:#0d3a6b;padding:6px;margin-top:9px}
.frow{display:flex;gap:16px;margin-top:9px;font-size:14px}
.frow div{flex:1;border-bottom:1px dashed #bbb;padding-bottom:4px;min-width:0;word-break:break-word}
.seatRow{display:flex;align-items:center;gap:12px;margin-top:11px}
.seatBox{flex:1;background:#fff2a8!important;border:2px solid #e8a91c;border-radius:11px;padding:8px;text-align:center}
.seatBox .lbl{font-size:12px;font-weight:bold;color:#555}
.seatBox .val{font-size:22px;font-weight:900;color:#d32f2f;line-height:1.2;word-break:break-word}
.qrBox{text-align:center;flex-shrink:0}
.qrBox img{width:78px;height:78px;border:2px solid #0d3a6b;border-radius:8px}
.qrBox p{margin:3px 0 0;font-size:10px;font-weight:bold;color:#0d5c3f;white-space:nowrap}
.foot{background:#e8f5e9!important;color:#0d5c3f;text-align:center;font-size:12.5px;font-weight:bold;padding:7px;border-top:1.5px solid #e8a91c;line-height:1.5;white-space:nowrap;overflow:hidden;margin-top:10px}
.planBox{margin-top:12px;border:2px solid #0d3a6b;border-radius:14px;padding:10px;background:#fff8d6}
.planHead{text-align:center;font-weight:900;color:#0d3a6b;font-size:15px}
.planSub{text-align:center;font-weight:900;font-size:13px;margin:2px 0 8px}
.countBar{display:flex;gap:6px;margin-bottom:10px}
.countBar div{flex:1;text-align:center;border-radius:9px;padding:7px 2px;font-weight:900;font-size:12px}
.cTotal{background:#e3f2fd} .cSel{background:#ffebee;color:#d32f2f} .cFree{background:#e8f5e9;color:#0d5c3f}
.selList{background:#fff;border:1.5px dashed #d32f2f;border-radius:9px;padding:7px;text-align:center;font-weight:900;font-size:13px;color:#d32f2f;margin-bottom:10px;min-height:34px}
.topRow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.topRow div{text-align:center;font-weight:900;padding:10px 4px;border-radius:10px;font-size:13px}
.pro,.bon{background:#8ecdf5} .cha{background:#000;color:#fff}
.front{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.sBox{border:1.5px solid #333;border-radius:8px;background:#fff;padding:6px 4px;cursor:pointer;text-align:center;font-size:12px;line-height:1.3}
.sBox b{font-size:13px} .sBox.sel{background:#d32f2f;color:#fff;border-color:#d32f2f} .sBox.booked{background:#555;color:#fff;border-color:#555;cursor:not-allowed}
.mainGrid{display:grid;grid-template-columns:1fr 1fr 28px 1fr 1fr;gap:6px;align-items:stretch}
.goli{display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-weight:900;color:#888;font-size:11px;letter-spacing:2px}
.lastRow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.lastTitle{text-align:center;color:#d32f2f;font-weight:900;font-size:12px;margin:10px 0 4px}
.clearBtn{width:100%;padding:9px;background:#fff;border:1.5px solid #d32f2f;color:#d32f2f;border-radius:9px;font-weight:900;margin-top:8px;cursor:pointer}
.standBtn{width:100%;padding:11px;background:#fff;border:2px dashed #0d3a6b;color:#0d3a6b;border-radius:10px;font-weight:900;margin-top:10px;cursor:pointer}
.standBtn.on{background:#0d3a6b;color:#fff}
.recBox{background:#fff;max-width:520px;margin:0 auto;padding:14px;border-radius:16px}
.recItem{border:1.5px solid #ddd;border-radius:12px;padding:10px;margin-top:10px;position:relative;font-size:13px;line-height:1.7;background:#fff}
.recItem.pending{border:2px solid #ff9800;background:#fff8e1}
.del{position:absolute;top:8px;right:8px;background:#fff;border:1px solid #d32f2f;color:#d32f2f;border-radius:8px;padding:4px 8px;font-weight:900;cursor:pointer}
.smallBtn{padding:8px 10px;border:0;border-radius:8px;font-weight:900;margin:4px 4px 0 0;cursor:pointer;background:#e3f2fd}
.smallBtn.green{background:#25D366;color:#fff}
.pendingBar{background:#ff9800;color:#fff;text-align:center;font-weight:900;padding:9px;border-radius:8px;margin-top:9px}
@media print{ body{background:#fff;padding:0} .form,.btnDown,.recBox{display:none!important} .page{max-width:90mm;width:90mm;margin:0 auto} @page{size:90mm auto;margin:0} }
</style>
</head>

<div style="background:#fff3cd;border:2px solid #ff9800;border-radius:10px;padding:10px;text-align:center;font-weight:900">⏳ পেন্ডিং: <span id="pendingCount">০</span> টা | ✅ কনফার্ম: <span id="confirmCount">০</span> টা</div>
<div class="grid2">

</div>
<div class="grid2">
<div><label>নাম</label><input id="inName" placeholder="যাত্রীর নাম"></div>
<div><label>মোবা</label><input id="inPhone" placeholder="০১XXXXXXXXX"></div>
</div>

<div><label>ঠিকানা</label><select id="inThikana"><option>গৌরীপুর</option><option>ভাংনামারী</option><option>ঈশ্বরগঞ্জ</option><option>কুমরীকান্দা</option><option>মাঝিপাড়া</option><option>আললপুর</option><option>চায়নামোড়</option><option>তারাকান্দা</option><option>হালুয়াঘাট</option><option>হোসেনপুর</option><option>গাজীপুর</option></select></div>

</div>
