<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>টিকেট ডাউনলোড</title>
<style>
  body{font-family:'Hind Siliguri',sans-serif; background:#f2f2f2; display:flex; flex-direction:column; align-items:center; padding:15px;}
  /* টিকেট - আগের সাইজের ২ গুন ছোট */
  .ticket{
    width:230px; background:#fff; border:1.5px solid #0b3d91;
    border-radius:8px; overflow:hidden; padding:0; font-size:11px;
  }
  .header{background:#0b3d91; color:#fff; text-align:center; padding:6px 4px;}
  .header b{font-size:13px; display:block;}
  .header small{font-size:10px; opacity:.9;}
  .info{padding:6px 8px; line-height:1.6;}
  .my-seat{
    background:#fff3a6; text-align:center; padding:4px;
    margin:0 8px; border-radius:5px; font-size:12px;
  }
  .my-seat b{color:#d00; font-size:15px;}
  .plan-title{text-align:center; font-weight:bold; margin:6px 0 4px; font-size:11px;}
  .plan{
    display:grid; grid-template-columns:repeat(4,1fr);
    gap:3px; padding:0 8px 6px;
  }
  .seat{
    border:1px solid #999; border-radius:3px; text-align:center;
    padding:3px 0; font-size:10px; background:#fff;
  }
  /* শুধু নিজের সিট */
  .seat.mine{background:#d32f2f; color:#fff; font-weight:bold; border-color:#d32f2f;}
  .seat.k-row{grid-column:span 1;}
  .footer{text-align:center; font-size:10px; padding:0 0 6px; color:#333;}
  button{
    margin-top:12px; background:#0b3d91; color:#fff; border:none;
    padding:8px 18px; border-radius:6px; cursor:pointer; font-size:14px;
  }
  @media print{
    body{background:#fff; padding:0;}
    button{display:none;}
    .ticket{border:1.5px solid #000;}
  }
</style>
</head>
<body>

<!-- ===== টিকেট শুরু ===== -->
<div class="ticket" id="ticket">
  <div class="header">
    <b>নুরমহল সুরেশ্বর বাস কাফেলা</b>
    <small>গৌরীপুর শন্তুগঞ্জ টু সুরেশ্বর দরবার শরীফ</small>
  </div>

  <div class="info">
    নাম: <b id="pName">জাহাঙ্গীর সুরেশ্বরী</b><br>
    ঠিকানা: মাঝিপাড়া | গাড়ি নং: ২<br>
    তারিখ: ২০২৬-১১-১৭ | ভাড়া: ১০২০ টাকা
  </div>

  <div class="my-seat">সিট নং: <b id="pSeat">A-1</b></div>

  <div class="plan-title">সিট প্ল্যান</div>
  <div class="plan" id="seatPlan"></div>

  <div class="footer">লাল = আপনার সিট</div>
</div>
<!-- ===== টিকেট শেষ ===== -->

<button onclick="window.print()">⬇ টিকেট ডাউনলোড / প্রিন্ট</button>

<script>
  // ===== এখানে শুধু নিজের ডাটা বসবে =====
  const myName = "জাহাঙ্গীর"; // ইউজারের নাম
  const mySeat = "A-1";       // ইউজারের সিট

  // সব সিটের লিস্ট
  const allSeats = [
    "N-3","M-1","M-2","N-4","M-3","M-4","N-1","N-2",
    "A-1","A-2","A-3","A-4",
    "B-1","B-2","B-3","B-4",
    "C-1","C-2","C-3","C-4",
    "D-1","D-2","D-3","D-4",
    "E-1","E-2","E-3","E-4",
    "F-1","F-2","F-3","F-4",
    "G-1","G-2","G-3","G-4",
    "H-1","H-2","H-3","H-4",
    "I-1","I-2","I-3","I-4",
    "J-1","J-2","J-3","J-4",
    "K1","K2","K3","K4","K5"
  ];

  const plan = document.getElementById("seatPlan");

  allSeats.forEach(seat => {
    const div = document.createElement("div");
    div.className = "seat";
    if(seat === mySeat){
      // শুধু নিজের সিটে নাম + লাল কালার
      div.classList.add("mine");
      div.innerHTML = seat + "<br>" + myName;
    } else {
      // বাকি সিটে শুধু নাম্বার - নাম নাই, বুকড নাই, খালি নাই
      div.textContent = seat;
    }
    plan.appendChild(div);
  });

  document.getElementById("pSeat").textContent = mySeat;
</script>

</body>
</html>
