<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#8b1e24"><title>নূরমহল ডিজিটাল টিকিট</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#222;font-family:system-ui,"Noto Sans Bengali",sans-serif}header{background:#8b1e24;color:#fff;text-align:center;padding:18px}h1{font-size:21px;margin:0}header p{margin:5px 0 0;font-size:13px}.wrap{max-width:720px;margin:auto;padding:14px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tabs button,.btn{border:0;border-radius:9px;padding:11px 14px;background:#8b1e24;color:#fff;font-weight:600}.tabs button{background:#e7dada;color:#542024}.tabs .active{background:#8b1e24;color:#fff}.panel{background:white;border-radius:12px;padding:15px;margin-bottom:13px;box-shadow:0 1px 5px #0001}.panel h2{font-size:18px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:13px;color:#555}input{display:block;width:100%;padding:11px;border:1px solid #ccd0d5;border-radius:8px;margin-top:5px;font:inherit}.wide{grid-column:1/-1}.btn{width:100%;margin-top:12px}.secondary{background:#536170}.hidden{display:none!important}.muted{font-size:13px;color:#667085}.ticket{border:1px dashed #8b1e24;border-radius:9px;padding:12px;margin:9px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}.ticket img{width:100px;height:100px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;background:#f8eeee;padding:10px;border-radius:8px}.stat b{font-size:22px;display:block}.ok{color:#087443}.bad{color:#b42318}#reader video{width:100%;max-width:420px}#result{text-align:center;padding:14px;font-weight:bold}@media print{header,.tabs,.no-print,.foot{display:none!important}.wrap{padding:0}.panel{box-shadow:none}.ticket{width:48%;display:inline-flex;vertical-align:top;break-inside:avoid}}
</style>
</head>
<body>
<header><h1>নূরমহল সুরেশ্বর বাস কাফেলা</h1><p>ডিজিটাল টিকিট ও QR যাচাই ব্যবস্থা</p></header>
<div class="wrap">
<nav class="tabs no-print"><button class="active" data-tab="create">টিকিট তৈরি</button><button data-tab="scan">QR স্ক্যান</button><button data-tab="list">টিকিট তালিকা</button></nav>
<section id="create" class="panel"><h2>নতুন টিকিট</h2><div class="grid">
<label>যাত্রীর নাম<input id="name"></label><label>মোবাইল<input id="phone" inputmode="tel"></label>
<label>তারিখ<input id="date" type="date"></label><label>সময়<input id="time" type="time"></label>
<label>কোথা থেকে<input id="from"></label><label>কোথায়<input id="to"></label>
<label>আসন নম্বর<input id="seat" placeholder="যেমন B3"></label><label>ভাড়া (৳)<input id="fare" type="number"></label>
</div><button class="btn" id="add">টিকিট তৈরি করুন</button><div id="newTicket"></div><p class="muted">প্রাথমিক সংস্করণ: ডেটা এই ফোনের ব্রাউজারে থাকে।</p></section>
<section id="scan" class="panel hidden"><h2>টিকিট যাচাই</h2><p class="muted">ক্যামেরা চালু করে QR স্ক্যান করুন।</p><button class="btn no-print" id="start">ক্যামেরা চালু</button><button class="btn secondary no-print" id="stop">ক্যামেরা বন্ধ</button><div id="reader"></div><div id="result">স্ক্যানের অপেক্ষায়…</div></section>
<section id="list" class="panel hidden"><h2>টিকিট তালিকা</h2><div class="stats"><div class="stat"><b id="total">0</b>মোট</div><div class="stat"><b id="used">0</b>বাসে উঠেছেন</div><div class="stat"><b id="left">0</b>বাকি</div></div><button class="btn secondary no-print" onclick="print()">সব টিকিট প্রিন্ট</button><button class="btn secondary no-print" id="backup">ব্যাকআপ ডাউনলোড</button><div id="tickets"></div></section>
<p class="foot muted">পরীক্ষামূলক সংস্করণ · বাস্তব যাত্রায় ব্যবহারের আগে পরীক্ষা করুন</p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $=x=>document.getElementById(x);let data=JSON.parse(localStorage.getItem('nmTickets')||'[]'),stream=null,active=false;
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem('nmTickets',JSON.stringify(data));draw()}
function draw(){$('total').textContent=data.length;$('used').textContent=data.filter(x=>x.used).length;$('left').textContent=data.filter(x=>!x.used).length;$('tickets').innerHTML='';data.forEach(t=>{let e=document.createElement('div');e.className='ticket';let info=document.createElement('div');info.innerHTML='<b>'+esc(t.name)+'</b><small><br>'+esc(t.code)+' · আসন '+esc(t.seat)+'<br>'+esc(t.date)+' · '+esc(t.from)+' → '+esc(t.to)+'<br>'+(t.used?'যাচাইকৃত':'যাচাই হয়নি')+'</small>';let q=document.createElement('div');e.append(info,q);$('tickets').append(e);if(window.QRCode)new QRCode(q,{text:t.token,width:95,height:95})})}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['create','scan','list'].forEach(id=>$(id).classList.toggle('hidden',id!==b.dataset.tab));stopCam();draw()});
$('add').onclick=()=>{let name=$('name').value.trim(),seat=$('seat').value.trim();if(!name||!seat)return alert('যাত্রীর নাম ও আসন নম্বর দিন');if(data.some(x=>x.seat.toLowerCase()===seat.toLowerCase()&&x.date===$('date').value))return alert('এই তারিখে আসনটি বরাদ্দ আছে');let id=Date.now()+'-'+Math.random().toString(36).slice(2);let t={id,name,phone:$('phone').value,date:$('date').value,time:$('time').value,from:$('from').value,to:$('to').value,seat,fare:$('fare').value,code:'NM-'+Date.now().toString().slice(-8),token:'NURMAHAL:'+id,used:false};data.push(t);save();$('newTicket').innerHTML='<div class="ticket"><div><b>'+esc(name)+'</b><br>'+esc(t.code)+' · আসন '+esc(seat)+'<br><button class="btn no-print" onclick="printOne(\\''+id+'\\')">টিকিট প্রিন্ট</button></div><div id="newqr"></div></div>';if(window.QRCode)new QRCode($('newqr'),{text:t.token,width:105,height:105});['name','phone','seat','fare'].forEach(x=>$(x).value='')};
window.printOne=id=>{let t=data.find(x=>x.id===id);if(!t)return;let w=open('','_blank');w.document.write('<h2>নূরমহল সুরেশ্বর বাস কাফেলা</h2><b>'+esc(t.name)+'</b><p>টিকিট: '+esc(t.code)+'<br>মোবাইল: '+esc(t.phone)+'<br>তারিখ: '+esc(t.date)+' '+esc(t.time)+'<br>রুট: '+esc(t.from)+' → '+esc(t.to)+'<br>আসন: '+esc(t.seat)+'<br>ভাড়া: ৳'+esc(t.fare)+'</p><div id="q"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\\/script><script>new QRCode(document.getElementById("q"),{text:'+JSON.stringify(t.token)+',width:130,height:130});setTimeout(()=>print(),700)<\\/script>');w.document.close()};
$('backup').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=u;a.download='nurmahal-ticket-backup.json';a.click();URL.revokeObjectURL(u)};
function verify(token){let t=data.find(x=>x.token===token);if(!t){$('result').innerHTML='<span class="bad">INVALID — টিকিট পাওয়া যায়নি</span>';return}if(t.used){$('result').innerHTML='<span class="bad">ALREADY USED — আগে স্ক্যান হয়েছে</span><br>'+esc(t.name)+' · '+esc(t.seat);return}t.used=true;t.usedAt=new Date().toISOString();save();$('result').innerHTML='<span class="ok">VALID — যাত্রী যাচাই সফল</span><br>'+esc(t.name)+' · '+esc(t.seat)}
async function startCam(){if(!('BarcodeDetector'in window))return $('result').textContent='এই Chrome-এ QR Scanner API নেই। আপডেটেড Chrome ব্যবহার করুন।';try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});let v=document.createElement('video');v.playsInline=true;v.srcObject=stream;await v.play();$('reader').replaceChildren(v);active=true;let d=new BarcodeDetector({formats:['qr_code']});async function tick(){if(!active)return;try{let c=await d.detect(v);if(c.length){verify(c[0].rawValue);stopCam();return}}catch(e){}requestAnimationFrame(tick)}tick()}catch(e){$('result').textContent='ক্যামেরার অনুমতি দিন; HTTPS পেজে খুলুন।'}}
function stopCam(){active=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null}
$('start').onclick=startCam;$('stop').onclick=stopCam;draw();
</script></body></html>
