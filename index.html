<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>নূরমহল সুরেশ্বর বাস কাফেলা</title>
<style>
body{margin:0;font-family:sans-serif;background:#f2f2f2;padding-bottom:20px}
.top{background:#8b1e1e;color:#fff;text-align:center;padding:15px}
.top h1{margin:0;font-size:22px}
.tabs{display:flex;gap:6px;padding:10px}
.tabs button{flex:1;padding:11px;border:1px solid #ddd;background:#fff;border-radius:10px;font-size:14px}
.tabs button.on{background:#8b1e1e;color:#fff}
.card{background:#fff;margin:0 12px 12px;padding:14px;border-radius:12px}
label{font-size:14px;color:#555}
input{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #ddd;border-radius:8px;font-size:16px;box-sizing:border-box}
.row{display:flex;gap:10px}.row>div{flex:1}
.btn{width:100%;padding:13px;border:0;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}
.btn-red{background:#8b1e1e;color:#fff}.btn-green{background:#25D366;color:#fff;margin-top:10px}.btn-blue{background:#007bff;color:#fff;margin-top:10px}.btn-gray{background:#eee;margin-top:10px}
.ticket{border:2px dashed #8b1e1e;padding:12px;border-radius:10px;text-align:center}
#qrcode{display:flex;justify-content:center;margin:10px 0}
#qrcode img{width:170px;height:170px}
#reader{width:100%;margin-top:10px}
.ok{color:green;font-weight:bold;font-size:20px}
.stat{display:flex;gap:8px;text-align:center}.stat div{flex:1;background:#fff3f3;padding:10px;border-radius:10px}.stat b{font-size:19px;color:#8b1e1e}
.bus{background:#fff8dc;border-radius:12px;padding:10px;margin-top:10px}
.bus-head{display:flex;gap:8px;margin-bottom:10px}.bus-head div{flex:1;text-align:center;padding:8px;border-radius:8px;font-weight:bold;font-size:12px}.bus-head .black{background:#000;color:#fff}
.seat-row{display:grid;grid-template-columns:1fr 1fr 28px 1fr 1fr;gap:6px;margin-bottom:6px;align-items:center}
.goli{text-align:center;color:#999;font-size:11px;font-weight:bold}
.seat{padding:8px 2px;text-align:center;border-radius:8px;font-weight:bold;font-size:12px;cursor:pointer;border:1px solid #ccc;background:#fff;line-height:1.3}
.seat small{font-weight:normal;font-size:10px;color:#666;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat.free{background:#fff}.seat.booked{background:#ffdddd;border-color:red;color:#a00}.seat.selected{background:#8b1e1e;color:#fff}.seat.selected small{color:#fff}
.last-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.item{border-bottom:1px solid #eee;padding:8px 0;font-size:14px}.small{font-size:12px;color:#777}
</style>
</head>

<div class="top"><h1>🚌 নূরমহল সুরেশ্বর বাস কাফেলা</h1><p>ডিজিটাল টিকিট সিস্টেম | মোট ৫১ সিট</p></div>
<div class="tabs">
<button id="t1" class="on" onclick="showTab(1)">🎫 টিকিট</button>
<button id="t2" onclick="showTab(2)">📷 স্ক্যান</button>
<button id="t3" onclick="showTab(3)">📋 লিস্ট</button>
</div>
