<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>নূরমহল সুরেশ্বর বাস কাফেলা</title>
<style>
body{margin:0;font-family:sans-serif;background:#f2f2f2}
.top{background:#8b1e1e;color:#fff;text-align:center;padding:15px}
.top h1{margin:0;font-size:24px}.top p{margin:5px 0 0}
.tabs{display:flex;gap:8px;padding:12px}
.tabs button{flex:1;padding:12px;border:1px solid #ddd;background:#fff;border-radius:10px;font-size:16px}
.tabs button.on{background:#8b1e1e;color:#fff}
.card{background:#fff;margin:0 12px 12px;padding:14px;border-radius:12px}
label{font-size:14px;color:#555}
input,select{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #ddd;border-radius:8px;font-size:16px;box-sizing:border-box}
.row{display:flex;gap:10px}.row>div{flex:1}
.btn{width:100%;padding:14px;border:0;border-radius:10px;font-size:17px;font-weight:bold;cursor:pointer}
.btn-red{background:#8b1e1e;color:#fff}
.btn-green{background:#25D366;color:#fff;margin-top:10px}
.btn-blue{background:#007bff;color:#fff;margin-top:10px}
.ticket{border:2px dashed #8b1e1e;padding:12px;border-radius:10px;text-align:center}
.ticket h3{margin:0;color:#8b1e1e}
#qrcode{display:flex;justify-content:center;margin:10px 0}
video{width:100%;border-radius:10px;background:#000}
.ok{color:green;font-weight:bold;font-size:20px}
</style>
</head>
<body>
<div class="top"><h1>🚌 নূরমহল সুরেশ্বর বাস কাফেলা</h1><p>ডিজিটাল টিকিট সিস্টেম</p></div>

<div class="tabs">
<button id="t1" class="on" onclick="showTab(1)">🎫 টিকিট বানান</button>
<button id="t2" onclick="showTab(2)">📷 QR স্ক্যান করুন</button>
</div>

<div id="tab1" class="card">
<label>যাত্রীর নাম</label><input id="name" placeholder="নাম লিখুন">
<div class="row"><div><label>মোবাইল</label><input id="phone" placeholder="01XXXXXXXXX"></div><div><label>সিট নং</label><input id="seat" placeholder="যেমন A1"></div></div>
<div class="row"><div><label>ভাড়া (টাকা)</label><input id="fare" type="number" placeholder="500"></div><div><label>তারিখ</label><input id="date" type="date"></div></div>
<button class="btn btn-red" onclick="makeTicket()">টিকিট বানান</button>
<div id="result" style="display:none;margin-top:15px">
<div class="ticket" id="ticketBox">
<h3>🚌 নূরমহল সুরেশ্বর বাস কাফেলা</h3>
<p id="tInfo"></p>
<div id="qrcode"></div>
<p style="font-size:13px;color:#555">এই QR টা স্ক্যান করলেই যাচাই হবে</p>
</div>
<button class="btn btn-green" onclick="sendWhats()">📱 WhatsApp এ পাঠান</button>
<button class="btn btn-blue" onclick="window.print()">🖨️ প্রিন্ট করুন</button>
</div>
</div>

<div id="tab2" class="card" style="display:none">
<button class="btn btn-red" onclick="startScan()">📷 ক্যামেরা চালু করুন</button>
<video id="video" playsinline style="display:none;margin-top:10px"></video>
<div id="scanResult" style="margin-top:12px;text-align:center"></div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
let lastText="";
function showTab(n){
document.getElementById('tab1').style.display=n==1?'block':'none';
document.getElementById('tab2').style.display=n==2?'block':'none';
document.getElementById('t1').className=n==1?'on':'';
document.getElementById('t2').className=n==2?'on':'';
}
function makeTicket(){
let n=document.getElementById('name').value, p=document.getElementById('phone').value, s=document.getElementById('seat').value, f=document.getElementById('fare').value, d=document.getElementById('date').value;
if(!n||!s){alert('নাম আর সিট দিন');return;}
lastText="নূরমহল টিকিট | নাম:"+n+" | মোবাইল:"+p+" | সিট:"+s+" | ভাড়া:"+f+" টাকা | তারিখ:"+d;
document.getElementById('tInfo').innerHTML="<b>"+n+"</b><br>মোবাইল: "+p+"<br>সিট: "+s+" | ভাড়া: "+f+" টাকা<br>তারিখ: "+d;
document.getElementById('result').style.display='block';
document.getElementById('qrcode').innerHTML="<img src='https://api.qrserver.com/v1/create-qr-code/?size=180x180&data="+encodeURIComponent(lastText)+"'>";
}
function sendWhats(){
let p=document.getElementById('phone').value;
if(!p){alert('মোবাইল নম্বর দিন');return;}
let msg=encodeURIComponent("🚌 নূরমহল সুরেশ্বর বাস কাফেলা - টিকিট\n"+lastText);
window.open("https://wa.me/88"+p+"?text="+msg,"_blank");
}
function startScan(){
document.getElementById('video').style.display='block';
let qr=new Html5Qrcode("video");
qr.start({facingMode:"environment"},{fps:10,qrbox:250},(txt)=>{
qr.stop();
document.getElementById('scanResult').innerHTML="<div class='ok'>✅ টিকিট সঠিক!</div><p>"+txt+"</p>";
}).catch(e=>{alert('ক্যামেরা চালু হয় নাই, অনুমতি দিন')});
}
document.getElementById('date').valueAsDate=new Date();
</script>
</body>
</html>
