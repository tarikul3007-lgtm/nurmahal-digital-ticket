<script>
// বুক করা সিটে চাপ দিলে বাতিল হবে
document.addEventListener('click', function(e){
  let seat = e.target.closest('button, .seat');
  if(!seat) return;
  if(seat.classList.contains('booked') || seat.classList.contains('selected')){
    if(confirm('এই সিটটা বাতিল করবা?')){
      seat.classList.remove('booked','selected');
      alert('সিট বাতিল হয়ে গেছে। এখন আবার খালি।');
      location.reload();
    }
  }
});
</script>
